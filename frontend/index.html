<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 药品问答系统</title>
<style>
/* ============================================================
   CSS Variables & Reset
   ============================================================ */
:root {
  --bg: #f0f4f8;
  --sidebar-bg: #1a1f36;
  --sidebar-text: #c2c7d6;
  --sidebar-active: #6366f1;
  --card-bg: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-secondary: #64748b;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --danger: #ef4444;
  --success: #10b981;
  --warning: #f59e0b;
  --msg-user: #eef2ff;
  --msg-assistant: #ffffff;
  --source-bg: #f8fafc;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --radius: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ============================================================
   Sidebar
   ============================================================ */
.sidebar {
  width: 340px;
  min-width: 340px;
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.sidebar-header {
  padding: 24px 20px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.sidebar-header h1 {
  font-size: 18px;
  color: #fff;
  font-weight: 700;
  letter-spacing: -.3px;
}
.sidebar-header p {
  font-size: 12px;
  color: var(--sidebar-text);
  margin-top: 4px;
}
.sidebar-section {
  padding: 20px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.sidebar-section h3 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #8b92a8;
  margin-bottom: 14px;
}
.file-upload-area {
  border: 2px dashed rgba(255,255,255,.15);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: .2s;
  margin-bottom: 12px;
}
.file-upload-area:hover, .file-upload-area.drag-over {
  border-color: var(--primary);
  background: rgba(99,102,241,.08);
}
.file-upload-area .icon { font-size: 28px; margin-bottom: 6px; }
.file-upload-area .hint { font-size: 12px; color: #8b92a8; }
.file-upload-area #fileName { font-size: 13px; color: #a5b4fc; margin-top: 4px; word-break: break-all; }

input[type="file"] { display: none; }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; color: #8b92a8; margin-bottom: 4px; }
.form-group input, .form-group select {
  width: 100%; padding: 9px 12px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 6px; color: #fff; font-size: 13px; outline: none;
}
.form-group input:focus { border-color: var(--primary); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: .2s; width: 100%;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-outline {
  background: transparent; color: #a5b4fc;
  border: 1px solid rgba(165,180,252,.3); width: auto; padding: 6px 14px;
}
.btn-outline:hover { background: rgba(99,102,241,.1); }
.btn-sm { font-size: 11px; padding: 5px 10px; width: auto; }

.status-badge {
  display: inline-block; padding: 3px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
}
.status-ok { background: rgba(16,185,129,.15); color: var(--success); }
.status-err { background: rgba(239,68,68,.15); color: var(--danger); }

.drug-list { max-height: 260px; overflow-y: auto; }
.drug-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 10px; border-radius: 6px; font-size: 12px;
  transition: .15s; cursor: default;
}
.drug-item:hover { background: rgba(255,255,255,.04); }
.drug-item .name { color: #e2e8f0; font-weight: 500; }
.drug-item .meta { color: #8b92a8; font-size: 11px; }
.drug-item .del-btn {
  background: none; border: none; color: #ef4444; cursor: pointer;
  font-size: 14px; padding: 2px 6px; border-radius: 4px; opacity: .6; transition: .15s;
}
.drug-item .del-btn:hover { opacity: 1; background: rgba(239,68,68,.15); }

/* ============================================================
   Main Chat Area
   ============================================================ */
.main {
  flex: 1; display: flex; flex-direction: column;
  min-width: 0; background: var(--bg);
}
.chat-header {
  padding: 16px 28px; background: #fff; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.chat-header h2 { font-size: 16px; font-weight: 600; }
.session-bar {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-secondary);
}
.session-bar code {
  background: #f1f5f9; padding: 3px 8px; border-radius: 4px;
  font-size: 11px; color: var(--primary);
}
.chat-messages {
  flex: 1; overflow-y: auto; padding: 20px 28px;
  display: flex; flex-direction: column; gap: 16px;
}
.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; color: var(--text-secondary); text-align: center;
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }
.empty-state h3 { font-size: 16px; margin-bottom: 6px; color: var(--text); }
.empty-state p { font-size: 13px; max-width: 400px; }

/* Messages */
.msg {
  display: flex; gap: 12px; max-width: 85%;
  animation: fadeIn .25s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.assistant { align-self: flex-start; }

.msg-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.msg.user .msg-avatar { background: #eef2ff; color: var(--primary); }
.msg.assistant .msg-avatar { background: #e0e7ff; color: #4338ca; }

.msg-bubble {
  padding: 12px 16px; border-radius: var(--radius);
  font-size: 14px; line-height: 1.65; box-shadow: var(--shadow);
  word-break: break-word;
}
.msg.user .msg-bubble { background: var(--primary); color: #fff; }
.msg.assistant .msg-bubble { background: #fff; border: 1px solid var(--border); }

/* Source references */
.sources-box {
  margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px;
}
.sources-toggle {
  font-size: 12px; color: var(--text-secondary); cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  background: none; border: none; padding: 4px 0;
}
.sources-toggle:hover { color: var(--primary); }
.sources-list {
  display: none; margin-top: 8px; display: flex; flex-direction: column; gap: 8px;
}
.sources-list.open { display: flex; }
.source-card {
  background: var(--source-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; font-size: 12px;
}
.source-card .src-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 4px;
}
.source-card .src-drug { font-weight: 600; color: var(--primary); }
.source-card .src-section { font-size: 11px; color: var(--text-secondary);
  background: #e2e8f0; padding: 1px 6px; border-radius: 10px; }
.source-card .src-score { font-size: 10px; color: var(--text-secondary); }
.source-card .src-text { color: var(--text); line-height: 1.5; margin-top: 4px; }

/* Thinking indicator */
.thinking { display: flex; gap: 4px; padding: 8px 12px; }
.thinking span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--primary);
  animation: bounce 1.2s infinite;
}
.thinking span:nth-child(2) { animation-delay: .2s; }
.thinking span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

/* Chat input */
.chat-input-area {
  padding: 16px 28px; background: #fff; border-top: 1px solid var(--border);
  display: flex; gap: 12px; align-items: flex-end;
}
.chat-input-area textarea {
  flex: 1; min-height: 44px; max-height: 120px; resize: none;
  padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 14px; font-family: inherit; outline: none; line-height: 1.5;
}
.chat-input-area textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
.chat-input-area button {
  width: 44px; height: 44px; border-radius: 50%; border: none;
  background: var(--primary); color: #fff; cursor: pointer; font-size: 18px;
  transition: .2s; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.chat-input-area button:hover { background: var(--primary-hover); }
.chat-input-area button:disabled { opacity: .5; cursor: not-allowed; }

/* Toasts */
.toast-container {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 12px 20px; border-radius: var(--radius); font-size: 13px;
  color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  animation: slideIn .3s ease; max-width: 400px;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--primary); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { width: 100%; min-width: 100%; position: absolute; z-index: 10; height: 100%; display: none; }
  .sidebar.open { display: flex; }
  .msg { max-width: 100%; }
}
</style>
</head>
<body>

<!-- ============================================================
     Sidebar — 知识库管理
     ============================================================ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>💊 RAG 药品问答系统</h1>
    <p>基于 LangGraph + Milvus 的智能药品知识库</p>
  </div>

  <!-- 系统状态 -->
  <div class="sidebar-section">
    <h3>🔌 系统状态</h3>
    <div id="systemStatus">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:12px">Milvus 向量库</span><span id="stMilvus" class="status-badge status-err">检测中...</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:12px">MySQL 数据库</span><span id="stMysql" class="status-badge status-err">检测中...</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:12px">Redis 缓存</span><span id="stRedis" class="status-badge status-err">检测中...</span>
      </div>
    </div>
  </div>

  <!-- 文档上传 -->
  <div class="sidebar-section">
    <h3>📄 构建知识库</h3>
    <div class="file-upload-area" id="dropZone">
      <div class="icon">📁</div>
      <span style="font-size:13px">点击选择或拖拽文件</span>
      <div class="hint">支持 PDF / DOCX / TXT</div>
      <div id="fileName"></div>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.docx,.txt">
    <div class="form-group">
      <label>药品名称（选填，从文件名推断）</label>
      <input type="text" id="drugNameInput" placeholder="留空则自动推断...">
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#8b92a8;margin-bottom:12px;cursor:pointer">
      <input type="checkbox" id="desensitizeCheck"> 启用 LLM 脱敏处理
    </label>
    <button class="btn btn-primary" id="uploadBtn" onclick="uploadDocument()">
      ⚡ 上传并入库
    </button>
    <div id="uploadStatus" style="font-size:12px;margin-top:8px;min-height:18px"></div>
  </div>

  <!-- 已入库药品 -->
  <div class="sidebar-section">
    <h3>📋 已入库药品 <button class="btn-outline btn-sm" onclick="refreshDrugs()" style="float:right">刷新</button></h3>
    <div class="drug-list" id="drugList">
      <div style="font-size:12px;color:#8b92a8;text-align:center;padding:20px">加载中...</div>
    </div>
  </div>
</aside>

<!-- ============================================================
     Main — 问答界面
     ============================================================ -->
<main class="main">
  <div class="chat-header">
    <h2>💬 药品知识问答</h2>
    <div class="session-bar">
      <span>会话:</span>
      <code id="sessionIdDisplay">---</code>
      <button class="btn-outline btn-sm" onclick="newSession()" title="新建会话">🔄 新建</button>
      <button class="btn-outline btn-sm" onclick="clearHistory()" title="清除当前">🗑 清除</button>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="empty-state" id="emptyState">
      <div class="icon">💊</div>
      <h3>欢迎使用药品知识问答系统</h3>
      <p>您可以询问药品的适应症、用法用量、禁忌、不良反应等信息。支持多轮对话，自动引用知识库原文。</p>
      <div style="margin-top:20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:500px">
        <button class="btn-outline btn-sm" onclick="quickAsk('阿司匹林的适应症是什么？')">阿司匹林适应症</button>
        <button class="btn-outline btn-sm" onclick="quickAsk('布洛芬和乙酰氨基酚有什么区别？')">布洛芬vs乙酰氨基酚</button>
        <button class="btn-outline btn-sm" onclick="quickAsk('二甲双胍的用法用量和禁忌？')">二甲双胍用法禁忌</button>
      </div>
    </div>
  </div>

  <div class="chat-input-area">
    <textarea id="chatInput" rows="1"
      placeholder="在此输入药品相关问题，例如：阿司匹林肠溶片的用法用量？"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
    <button onclick="sendMessage()" id="sendBtn" title="发送消息">➤</button>
  </div>
</main>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ============================================================
// State
// ============================================================
const API = '/api/v1';
let currentSessionId = '';

// ============================================================
// Init
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  checkHealth();
  refreshDrugs();
  newSession();
  setupDragDrop();
});

// ============================================================
// System Health
// ============================================================
async function checkHealth() {
  try {
    const r = await fetch('/health/ready');
    const d = await r.json();
    setStatus('stMilvus', d.checks?.milvus ?? false);
    setStatus('stMysql', d.checks?.mysql ?? false);
    setStatus('stRedis', d.checks?.redis ?? false);
  } catch {
    setStatus('stMilvus', false);
    setStatus('stMysql', false);
    setStatus('stRedis', false);
  }
}
function setStatus(id, ok) {
  const el = document.getElementById(id);
  el.textContent = ok ? '正常' : '未连接';
  el.className = `status-badge ${ok ? 'status-ok' : 'status-err'}`;
}

// ============================================================
// Session
// ============================================================
function newSession() {
  currentSessionId = 'sess_' + Math.random().toString(36).slice(2, 10);
  document.getElementById('sessionIdDisplay').textContent = currentSessionId;
  document.getElementById('chatMessages').innerHTML = `
    <div class="empty-state" id="emptyState">
      <div class="icon">💊</div>
      <h3>新会话已创建</h3>
      <p>您可以询问药品的适应症、用法用量、禁忌、不良反应等信息。</p>
    </div>`;
}

async function clearHistory() {
  if (!currentSessionId) return;
  try {
    await fetch(`${API}/chat/history/${currentSessionId}`, { method: 'DELETE' });
    showToast('会话已清除', 'info');
    newSession();
  } catch (e) { showToast('清除失败', 'error'); }
}

// ============================================================
// File Upload & DragDrop
// ============================================================
function setupDragDrop() {
  const zone = document.getElementById('dropZone');
  const input = document.getElementById('fileInput');

  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    if (input.files.length) {
      document.getElementById('fileName').textContent = '已选择: ' + input.files[0].name;
    }
  });

  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const files = e.dataTransfer.files;
    if (files.length) {
      input.files = files;
      document.getElementById('fileName').textContent = '已选择: ' + files[0].name;
    }
  });
}

async function uploadDocument() {
  const fileInput = document.getElementById('fileInput');
  const file = fileInput.files[0];
  if (!file) { showToast('请先选择文件', 'error'); return; }

  const btn = document.getElementById('uploadBtn');
  const status = document.getElementById('uploadStatus');
  btn.disabled = true;
  btn.textContent = '⏳ 入库中...';
  status.innerHTML = '<span style="color:#f59e0b">正在处理...</span>';

  const form = new FormData();
  form.append('file', file);
  const drugName = document.getElementById('drugNameInput').value.trim();
  if (drugName) form.append('drug_name', drugName);
  form.append('desensitize', document.getElementById('desensitizeCheck').checked);

  try {
    const r = await fetch(`${API}/knowledge/upload`, { method: 'POST', body: form });
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail || '上传失败'); }
    const d = await r.json();
    status.innerHTML = `<span style="color:#10b981">✅ 入库成功！${d.drug_name}: ${d.indexed_chunks}/${d.total_chunks} chunks</span>`;
    showToast(`知识库已更新: ${d.drug_name}`, 'success');
    refreshDrugs();
    checkHealth();
    // 清空文件
    fileInput.value = '';
    document.getElementById('fileName').textContent = '';
    document.getElementById('drugNameInput').value = '';
  } catch (e) {
    status.innerHTML = `<span style="color:#ef4444">❌ ${e.message}</span>`;
    showToast('入库失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '⚡ 上传并入库';
  }
}

// ============================================================
// Drug List
// ============================================================
async function refreshDrugs() {
  const container = document.getElementById('drugList');
  try {
    const r = await fetch(`${API}/knowledge/drugs`);
    if (!r.ok) throw new Error('查询失败');
    const d = await r.json();
    if (!d.drugs.length) {
      container.innerHTML = '<div style="font-size:12px;color:#8b92a8;text-align:center;padding:20px">暂无已入库药品</div>';
      return;
    }
    container.innerHTML = d.drugs.map(dr => `
      <div class="drug-item">
        <div>
          <div class="name">${escHtml(dr.drug_name)}</div>
          <div class="meta">${dr.chunk_count} chunks · ${escHtml(dr.category || '未分类')}</div>
        </div>
        <button class="del-btn" title="删除" onclick="deleteDrug(${dr.id},'${escHtml(dr.drug_name)}')">×</button>
      </div>`).join('');
  } catch {
    container.innerHTML = '<div style="font-size:12px;color:#ef4444;text-align:center;padding:20px">加载失败</div>';
  }
}

async function deleteDrug(id, name) {
  if (!confirm(`确定要删除 "${name}" 的所有数据吗？\n（MySQL + Milvus 数据将被同时清除）`)) return;
  try {
    const r = await fetch(`${API}/knowledge/drug/${id}`, { method: 'DELETE' });
    if (!r.ok) throw new Error('删除失败');
    showToast(`已删除: ${name}`, 'success');
    refreshDrugs();
  } catch (e) { showToast('删除失败: ' + e.message, 'error'); }
}

// ============================================================
// Chat
// ============================================================
function quickAsk(question) {
  document.getElementById('chatInput').value = question;
  sendMessage();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (!message) return;

  // Remove empty state
  const emptyState = document.getElementById('emptyState');
  if (emptyState) emptyState.remove();

  // Append user message
  const messages = document.getElementById('chatMessages');
  messages.appendChild(createMsgEl('user', message));
  input.value = '';
  input.style.height = 'auto';

  // Show thinking
  const thinkEl = createThinkEl();
  messages.appendChild(thinkEl);
  messages.scrollTop = messages.scrollHeight;

  // Disable input
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  // Stream
  let fullAnswer = '';
  let sources = [];
  let assistantEl = null;

  try {
    const r = await fetch(`${API}/chat/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: message,
        session_id: currentSessionId,
        stream: true
      })
    });

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let currentEventType = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE events are separated by \n\n
      const parts = buffer.split('\n\n');
      buffer = parts.pop() || ''; // keep incomplete part

      for (const part of parts) {
        if (!part.trim()) continue;
        const lines = part.split('\n');
        let eventType = '';
        let dataLines = [];

        for (const line of lines) {
          if (line.startsWith('event: ')) {
            eventType = line.slice(7).trim();
          } else if (line.startsWith('data: ')) {
            dataLines.push(line.slice(6));
          }
        }

        if (!dataLines.length) continue;
        const dataStr = dataLines.join('\n');

        if (eventType === 'sources') {
          // Named SSE event for sources: event: sources\ndata: [...]
          try {
            sources = JSON.parse(dataStr);
          } catch { /* ignore parse error */ }
          continue;
        }

        // Generic JSON events: data: {"event":"token","data":"..."}
        try {
          const evt = JSON.parse(dataStr);
          if (evt.event === 'token') {
            fullAnswer += evt.data;
            if (!assistantEl) {
              if (thinkEl.parentNode) thinkEl.remove();
              assistantEl = createMsgEl('assistant', '');
              messages.appendChild(assistantEl);
            }
            const bubble = assistantEl.querySelector('.msg-bubble');
            bubble.innerHTML = renderMarkdown(fullAnswer);
            messages.scrollTop = messages.scrollHeight;
          } else if (evt.event === 'done') {
            // stream complete
          } else if (evt.event === 'error') {
            fullAnswer += '\n\n[错误] ' + evt.data;
            if (!assistantEl) {
              if (thinkEl.parentNode) thinkEl.remove();
              assistantEl = createMsgEl('assistant', '');
              messages.appendChild(assistantEl);
            }
          }
        } catch {
          // Raw text token fallback
          if (dataStr && dataStr.length < 500) {
            fullAnswer += dataStr;
            if (!assistantEl) {
              if (thinkEl.parentNode) thinkEl.remove();
              assistantEl = createMsgEl('assistant', '');
              messages.appendChild(assistantEl);
            }
            const bubble = assistantEl.querySelector('.msg-bubble');
            bubble.innerHTML = renderMarkdown(fullAnswer);
          }
        }
      }
    }
  } catch (e) {
    if (!assistantEl) {
      if (thinkEl.parentNode) thinkEl.remove();
      assistantEl = createMsgEl('assistant', '');
      messages.appendChild(assistantEl);
    }
    fullAnswer += '\n\n[网络错误] ' + e.message;
  }

  // Clean up thinking if still present
  if (thinkEl.parentNode) thinkEl.remove();

  // Finalize assistant message
  if (!assistantEl) {
    assistantEl = createMsgEl('assistant', '');
    messages.appendChild(assistantEl);
  }
  const bubble = assistantEl.querySelector('.msg-bubble');
  bubble.innerHTML = renderMarkdown(fullAnswer || '（未收到回复）');

  // Append sources if any
  if (sources.length) {
    bubble.appendChild(createSourcesEl(sources));
  }

  sendBtn.disabled = false;
  messages.scrollTop = messages.scrollHeight;
  input.focus();
}

// ============================================================
// UI Helpers
// ============================================================
function createMsgEl(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-avatar">${role === 'user' ? '👤' : '🤖'}</div>
    <div class="msg-bubble">${text ? renderMarkdown(text) : ''}</div>`;
  return div;
}

function createThinkEl() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-bubble"><div class="thinking"><span></span><span></span><span></span></div></div>`;
  return div;
}

function createSourcesEl(sources) {
  const wrapper = document.createElement('div');
  wrapper.className = 'sources-box';

  const toggle = document.createElement('button');
  toggle.className = 'sources-toggle';
  toggle.innerHTML = '📚 查看参考来源 (' + sources.length + ') ▸';
  toggle.onclick = function() {
    const list = this.nextElementSibling;
    const open = list.classList.toggle('open');
    this.innerHTML = '📚 参考来源 (' + sources.length + ') ' + (open ? '▾' : '▸');
  };

  const list = document.createElement('div');
  list.className = 'sources-list';
  list.innerHTML = sources.map((s, i) => `
    <div class="source-card">
      <div class="src-header">
        <span class="src-drug">${escHtml(s.drug_name || '未知')}</span>
        <span class="src-section">${escHtml(s.section || '通用')}</span>
      </div>
      <div class="src-text">${escHtml((s.chunk_text || '').slice(0, 300))}${(s.chunk_text||'').length > 300 ? '...' : ''}</div>
      <div class="src-score">相关性得分: ${s.score != null ? s.score.toFixed(4) : 'N/A'}</div>
    </div>`).join('');

  wrapper.appendChild(toggle);
  wrapper.appendChild(list);
  return wrapper;
}

function renderMarkdown(text) {
  if (!text) return '';
  // Simple markdown: bold, italic, lists, newlines
  let html = escHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/^(\d+)\.\s(.+)$/gm, '<li>$2</li>');
  html = html.replace(/(<li>.*<\/li>)/s, '<ol>$1</ol>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
// Toast
// ============================================================
function showToast(msg, type) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, 3500);
}
</script>
