# ============================================================
# RAG 临床病例分析助手 - 主配置文件
# v1.0.0: 从药品问答改造为病例分析
# 所有业务参数、模型选择、数据库配置均集中在此文件
# 注意：API Key 等敏感信息不要写在这里，写在 .env 中
# ============================================================

# ===== 模型配置 =====
models:
  # 文本切分参数
  splitter:
    chunk_size: 500          # 每块目标字符数
    chunk_overlap: 50        # 块间重叠字符数（防止跨块信息丢失）
    min_chunk_size: 100     # 最小块字符数（低于此值合并到上一块）
    separator: "\n\n"        # 优先分割符（段落分隔）

  # 嵌入模型（文本 → 向量）
  embedding:
    provider: "dashscope"    # 可选: dashscope / openai / local
    model: "text-embedding-v4"
    dimension: 1024          # Milvus 建索引维度（text-embedding-v4 支持 64/128/256/512/768/1024/1536/2048）
    batch_size: 10           # 每批嵌入的文本块数量（DashScope API 限制 ≤10）

  # 门禁模型（二元判断：临床医学相关 / 非临床医学）
  intent:
    provider: "dashscope"
    model: "qwen-flash"      # 轻量模型做二元门禁，可选: qwen-flash / qwen-plus / qwen-turbo
    temperature: 0.1
    max_tokens: 200

  # 病例结构化提取模型
  case_extraction:
    provider: "dashscope"
    model: "qwen-flash"      # 轻量模型做结构化提取
    temperature: 0.1
    max_tokens: 800

  # 问答生成模型
  chat:
    provider: "dashscope"
    model: "qwen3-max"
    temperature: 0.3         # 适当随机性，避免过于机械
    max_tokens: 2000          # 最大生成 token 数
    top_p: 0.95
    top_k: 50

  # 重排序模型（对检索结果二次排序）
  rerank:
    provider: "dashscope"
    model: "qwen3-rerank"    # 通义千问重排序模型（gte-rerank 已下线）

# ===== 检索配置 =====
retrieval:
  # 向量检索
  vector_top_k: 20           # Milvus 向量检索取 Top-K
  # BM25 检索
  bm25_top_k: 20             # MySQL 全文索引检索取 Top-K
  # RRF 融合
  rrf_k: 60                  # RRF 算法参数（通常 60）
  rrf_top_n: 5               # RRF 融合后取 Top-N 送生成模型
  # 关键词过滤
  enable_keyword_filter: true  # 是否启用关键词过滤（商品名/通用名精确匹配）

# ===== 数据库配置 =====
database:
  milvus:
    collection_name: "drug_chunks"    # Collection 名称
    dimension: 1024                   # 向量维度（必须与 embedding.dimension 一致）
    index_type: "IVF_FLAT"           # 索引类型: IVF_FLAT / HNSW / DISKANN
    metric_type: "IP"                # 相似度度量: IP(内积) / L2(欧氏距离) / COSINE
    nlist: 1024                      # IVF 索引聚类数
    nprobe: 16                       # 查询时探针数（精度与速度的权衡）
    description: "药品说明书切分文本块向量库"

  # v1.0.0: 多源检索配置
  multi_source:
    enabled: true                    # 是否启用多源并行检索
    default_sources:                 # 默认检索源
      - "drug"
      - "disease"
      - "guideline"
      - "literature"
    top_n_per_source: 5              # 每个源取 Top-N
    final_top_n: 15                  # 跨源融合后最终取 N 条
    per_source_min: 2                # 均衡采样时每种源至少保留的条数
    # 各 source_type 的向量检索参数
    source_params:
      drug:
        vector_top_k: 20
        bm25_top_k: 20
      disease:
        vector_top_k: 15
        bm25_top_k: 15
      guideline:
        vector_top_k: 15
        bm25_top_k: 15
      literature:
        vector_top_k: 15
        bm25_top_k: 15

  mysql:
    database: "rag_pharma"
    raw_docs_table: "drug_raw_docs"      # 原始文档表
    chunks_table: "drug_chunks"           # 切分文本块表
    metadata_table: "drug_metadata"      # 药品元数据表
    index_records_table: "index_records"  # 索引批次记录表
    # MySQL 连接池配置
    pool_size: 5
    pool_recycle: 3600                  # 连接回收时间（秒）

# ===== 短期记忆配置 =====
memory:
  summarize_model: "qwen-flash"  # 摘要模型（快速、便宜）
  recent_turns: 4                # 保留最近 N 轮完整对话（超出部分压缩为摘要）
  summary_max_tokens: 600        # 摘要最大生成 token 数
  max_summary_chars: 800         # 摘要最大存储字符数
  enabled: true                  # 全局记忆功能开关（false 时所有会话均不启用短期记忆）
  token_threshold_ratio: 0.7     # token 触发阈值比例（超过上下文窗口的此比例时触发摘要）
  context_window_tokens: 8192    # 模型上下文窗口大小（token 数，用于阈值计算）

# ===== 中期记忆配置（跨会话用户动态记忆）=====
user_memory:
  extract_model: "qwen-flash"     # 记忆提取模型（快速、便宜）
  max_memories_per_user: 50        # 每个用户最多保留多少条记忆
  decay_factor: 0.95               # 每日衰减系数（每天 ×0.95）
  min_importance: 0.1              # 最低重要性阈值（低于此值自动删除）
  recall_top_k: 5                  # 每次请求召回 Top-K 条记忆注入 prompt
  merge_threshold: 0.6             # 关键词重叠度阈值（超过则合并而非新增）

# ===== 长期记忆配置（用户画像 —— 不可变人口属性）=====
user_profile:
  extract_model: "qwen-flash"      # 画像提取模型（轻量级即可）
  min_confidence: 0.5              # 最低置信度阈值（低于此值不保存）

# ===== Redis 配置 =====
redis:
  session_ttl: 3600            # 会话过期时间（秒，1小时）
  max_history: 20               # 单会话最多保留多少轮对话（摘要模式下可设大一些）
  cache_ttl: 300                # 通用缓存过期时间（秒）

# ===== 安全配置 =====
security:
  # API Key 鉴权
  auth:
    enabled: true             # 是否启用 API Key 鉴权（设为 false 则完全跳过）
  # 速率限制（基于 IP 的滑动窗口算法）
  rate_limit:
    enabled: true             # 是否启用速率限制
    requests_per_minute: 60   # 每分钟单 IP 最大请求数
  # HTTP 安全响应头
  headers:
    x_content_type_options: "nosniff"
    x_frame_options: "DENY"
    x_xss_protection: "1; mode=block"
    referrer_policy: "strict-origin-when-cross-origin"

# ===== 应用配置 =====
app:
  debug: false
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
  api_prefix: "/api/v1"
  # 问答历史记录上限（防止上下文过长）
  max_conversation_turns: 10

# ===== 日志配置 =====
logging:
  level: "INFO"                 # DEBUG / INFO / WARNING / ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"
  max_bytes: 10485760           # 单个日志文件最大 10MB
  backup_count: 5              # 保留的日志文件数量
