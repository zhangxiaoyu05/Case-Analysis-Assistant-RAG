<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="api-key" content="__API_KEY_PLACEHOLDER__">
<title>知识库管理 — 临床病例分析助手</title>
<style>
/* ============================================================
   CSS Variables — Botanical warm theme (shared with index.html)
   ============================================================ */
:root {
  --primary: #0d9488;
  --primary-hover: #0f766e;
  --primary-light: #f0fdfa;
  --primary-100: #ccfbf1;
  --bg: #fafaf9;
  --card: #ffffff;
  --border: #e7e5e4;
  --text: #1c1917;
  --text-secondary: #78716c;
  --text-muted: #a8a29e;
  --danger: #ef4444;
  --success: #10b981;
  --warning: #f59e0b;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.05);
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ============================================================
   Header
   ============================================================ */
.header {
  width: 100%; max-width: 640px;
  padding: 20px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.header-title { font-size: 16px; font-weight: 700; }
.header-subtitle { font-size: 13px; color: var(--text-secondary); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: .15s; font-family: inherit;
  text-decoration: none; white-space: nowrap;
}
.btn-ghost {
  background: transparent; color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.btn-primary { background: var(--primary); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-sm { font-size: 11px; padding: 5px 12px; }
.btn-danger-sm {
  font-size: 11px; padding: 3px 8px; border-radius: 6px;
  border: 1px solid rgba(239,68,68,.2); background: transparent;
  color: var(--danger); cursor: pointer; font-family: inherit;
}
.btn-danger-sm:hover { background: rgba(239,68,68,.08); }

/* ============================================================
   Main Content
   ============================================================ */
.main {
  width: 100%; max-width: 640px;
  padding: 0 24px 40px;
  display: flex; flex-direction: column; gap: 20px;
}

/* Cards */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 24px;
  box-shadow: var(--shadow);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.card-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card-subtitle { font-size: 12px; color: var(--text-muted); }

/* Status */
.status-row {
  display: flex; gap: 12px; flex-wrap: wrap;
}
.status-item {
  flex: 1; min-width: 100px;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-radius: 8px;
  background: #fafaf9; border: 1px solid var(--border);
}
.status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.status-dot.ok { background: var(--success); }
.status-dot.err { background: var(--danger); }
.status-label { font-size: 12px; color: var(--text-secondary); }
.status-value { font-size: 13px; font-weight: 600; margin-left: auto; }

/* Upload */
.upload-zone {
  border: 2px dashed var(--border); border-radius: 10px;
  padding: 28px; text-align: center; cursor: pointer;
  transition: .15s; margin-bottom: 14px;
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--primary);
  background: var(--primary-light);
}
.upload-zone .icon { font-size: 32px; margin-bottom: 8px; }
.upload-zone .title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.upload-zone .hint { font-size: 12px; color: var(--text-muted); }
.upload-zone .file-name { font-size: 13px; color: var(--primary); margin-top: 6px; font-weight: 500; word-break: break-all; }
input[type="file"] { display: none; }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
.form-group input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px; font-family: inherit; outline: none;
  transition: .15s;
}
.form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,148,136,.08); }
.upload-status { font-size: 12px; margin-top: 8px; min-height: 18px; }

/* Source tabs */
.source-tab {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: transparent; color: var(--text-secondary); cursor: pointer;
  font-size: 12px; font-family: inherit; transition: .15s;
}
.source-tab:hover { border-color: var(--primary); color: var(--primary); }
.source-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Drug list */
.drug-list { max-height: 400px; overflow-y: auto; }
.drug-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; border-radius: 8px; transition: .1s;
}
.drug-item:hover { background: var(--primary-light); }
.drug-item + .drug-item { border-top: 1px solid var(--border); }
.drug-item .name { font-size: 13px; font-weight: 500; }
.drug-item .meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.drug-item .right { display: flex; align-items: center; gap: 10px; }
.drug-count { font-size: 12px; color: var(--text-secondary); font-weight: 500; }

.empty-hint { text-align: center; padding: 32px 20px; color: var(--text-muted); font-size: 13px; }

/* Search */
.search-box {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.search-box input {
  flex: 1; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px; font-family: inherit; outline: none;
  transition: .15s;
}
.search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,148,136,.08); }
.search-box button {
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); cursor: pointer; font-size: 13px; font-family: inherit;
  color: var(--text-secondary); transition: .15s;
}
.search-box button:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

/* Source-specific metadata */
.src-meta-item {
  display: inline-block; padding: 2px 6px; margin-right: 4px;
  border-radius: 4px; font-size: 10px; font-weight: 500;
}
.src-meta-drug { background: #dbeafe; color: #1e40af; }
.src-meta-disease { background: #fce7f3; color: #9d174d; }
.src-meta-guideline { background: #d1fae5; color: #065f46; }
.src-meta-literature { background: #fef3c7; color: #92400e; }

/* ============================================================
   Toasts
   ============================================================ */
.toast-container {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 500;
  color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  animation: slideIn .3s ease; max-width: 380px; pointer-events: auto;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--primary); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 640px) {
  .header { padding: 16px; }
  .main { padding: 0 16px 32px; }
  .card { padding: 16px; }
}
</style>
</head>
<body>

<!-- ============================================================
     Header
     ============================================================ -->
<header class="header">
  <div class="header-left">
    <a href="/" class="btn btn-ghost btn-sm" style="text-decoration:none">← 返回问答</a>
  </div>
  <div style="text-align:right">
    <div class="header-title">⚙️ 知识库管理</div>
    <div class="header-subtitle">上传文档 · 管理知识库（药品/疾病/指南/文献）</div>
  </div>
</header>

<!-- ============================================================
     Main Content
     ============================================================ -->
<div class="main">

  <!-- System Status -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">🔌 系统状态</span>
      <button class="btn btn-ghost btn-sm" onclick="checkHealth()">刷新</button>
    </div>
    <div class="status-row">
      <div class="status-item">
        <span class="status-dot err" id="dotMilvus"></span>
        <span class="status-label">Milvus</span>
        <span class="status-value" id="valMilvus">检测中</span>
      </div>
      <div class="status-item">
        <span class="status-dot err" id="dotMysql"></span>
        <span class="status-label">MySQL</span>
        <span class="status-value" id="valMysql">检测中</span>
      </div>
      <div class="status-item">
        <span class="status-dot err" id="dotRedis"></span>
        <span class="status-label">Redis</span>
        <span class="status-value" id="valRedis">检测中</span>
      </div>
    </div>
  </div>

  <!-- Upload -->
  <div class="card">
    <div class="card-title" style="margin-bottom:16px">📄 上传文档入库</div>
    <div class="upload-zone" id="dropZone">
      <div class="icon">📁</div>
      <div class="title">点击选择文件或拖拽到此处</div>
      <div class="hint">支持 PDF、DOCX、TXT 格式，最大 20MB</div>
      <div class="file-name" id="fileName"></div>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.docx,.txt">
    <div class="form-row" style="display:flex;gap:12px;margin-bottom:12px">
      <div class="form-group" style="flex:2;margin-bottom:0">
        <label>来源类型</label>
        <select id="sourceTypeSelect" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff" onchange="onSourceTypeChange()">
          <option value="auto">🤖 自动识别</option>
          <option value="drug">💊 药品说明书</option>
          <option value="disease">🦠 疾病知识</option>
          <option value="guideline">📋 临床指南</option>
          <option value="literature">📄 学术文献</option>
        </select>
      </div>
      <div class="form-group" style="flex:3;margin-bottom:0">
        <label id="extraFieldLabel">药品名称（选填）</label>
        <input type="text" id="extraFieldInput" placeholder="留空则从文件名自动推断...">
      </div>
    </div>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:400">
        <input type="checkbox" id="desensitizeCheck"> 启用 LLM 脱敏处理
      </label>
    </div>
    <button class="btn btn-primary" id="uploadBtn" onclick="uploadDocument()">
      ⚡ 上传并入库
    </button>
    <div class="upload-status" id="uploadStatus"></div>
  </div>

  <!-- v1.0.0: Multi-source list -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">📋 知识库概览 <span style="font-weight:400;color:var(--text-muted);font-size:12px" id="sourceCounts"></span></span>
      <button class="btn btn-ghost btn-sm" onclick="refreshSources()">🔄 刷新</button>
    </div>
    <!-- Source tabs -->
    <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap" id="sourceTabs">
      <button class="source-tab active" data-source="drug" onclick="switchSourceTab('drug')">💊 药品</button>
      <button class="source-tab" data-source="disease" onclick="switchSourceTab('disease')">🦠 疾病</button>
      <button class="source-tab" data-source="guideline" onclick="switchSourceTab('guideline')">📋 指南</button>
      <button class="source-tab" data-source="literature" onclick="switchSourceTab('literature')">📄 文献</button>
    </div>
    <!-- Search -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索知识库条目..." oninput="onSearchInput()">
      <button onclick="clearSearch()">✕ 清除</button>
    </div>
    <div class="drug-list" id="sourceList">
      <div class="empty-hint">加载中...</div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ============================================================
// API Key auto-inject (shared with index.html)
// ============================================================
const API_KEY = document.querySelector('meta[name="api-key"]')?.content || '';
if (API_KEY) {
  const _fetch = window.fetch;
  window.fetch = function(url, options = {}) {
    if (typeof url === 'string' && (url.startsWith('/api/') || url.includes('/api/'))) {
      options = { ...options };
      if (options.headers instanceof Headers) {
        options.headers = new Headers(options.headers);
        options.headers.set('X-API-Key', API_KEY);
      } else {
        options.headers = { ...(options.headers || {}), 'X-API-Key': API_KEY };
      }
    }
    return _fetch.call(this, url, options);
  };
}

const API = '/api/v1';
let currentSource = 'drug';
let allSourceData = {}; // Cache all source data for client-side search
let currentSearchQuery = '';

// ============================================================
// Init
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  checkHealth();
  refreshSources();
  setupDragDrop();
  onSourceTypeChange(); // Set initial field labels
});

// ============================================================
// Health
// ============================================================
async function checkHealth() {
  try {
    const r = await fetch('/health/ready');
    const d = await r.json();
    setHealth('Milvus', d.checks?.milvus ?? false);
    setHealth('Mysql', d.checks?.mysql ?? false);
    setHealth('Redis', d.checks?.redis ?? false);
  } catch {
    setHealth('Milvus', false);
    setHealth('Mysql', false);
    setHealth('Redis', false);
  }
}
function setHealth(name, ok) {
  const dot = document.getElementById('dot' + name);
  const val = document.getElementById('val' + name);
  if (dot) dot.className = 'status-dot ' + (ok ? 'ok' : 'err');
  if (val) val.textContent = ok ? '正常' : '未连接';
}

// ============================================================
// Drag & Drop
// ============================================================
function setupDragDrop() {
  const zone = document.getElementById('dropZone');
  const input = document.getElementById('fileInput');
  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    if (input.files.length) {
      document.getElementById('fileName').textContent = '已选择: ' + input.files[0].name;
    }
  });
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) {
      input.files = e.dataTransfer.files;
      document.getElementById('fileName').textContent = '已选择: ' + e.dataTransfer.files[0].name;
    }
  });
}

// ============================================================
// Dynamic source type fields
// ============================================================
function onSourceTypeChange() {
  const sourceType = document.getElementById('sourceTypeSelect').value;
  const label = document.getElementById('extraFieldLabel');
  const input = document.getElementById('extraFieldInput');

  const config = {
    auto:        { label: '文档名称（选填）', placeholder: '留空则由 AI 自动识别类型和名称...' },
    drug:       { label: '药品名称（选填）', placeholder: '留空则从文件名自动推断...' },
    disease:    { label: '疾病名称（选填）', placeholder: '例如：2型糖尿病、心力衰竭...' },
    guideline:  { label: '指南标题（选填）', placeholder: '例如：中国心力衰竭诊疗指南2024...' },
    literature: { label: '文献标题（选填）', placeholder: '例如：Efficacy of SGLT2i in HFrEF...' },
  };

  const cfg = config[sourceType] || config.auto;
  label.textContent = cfg.label;
  input.placeholder = cfg.placeholder;

  // Hint text below the select
  let hintEl = document.getElementById('sourceTypeHint');
  if (!hintEl) {
    hintEl = document.createElement('div');
    hintEl.id = 'sourceTypeHint';
    hintEl.style.cssText = 'font-size:11px;color:var(--text-muted);margin-top:4px;';
    document.getElementById('sourceTypeSelect').parentElement.appendChild(hintEl);
  }
  if (sourceType === 'auto') {
    hintEl.textContent = '🤖 AI 将自动分析文档内容，判断类型并提取元数据';
  } else {
    hintEl.textContent = '';
  }
}

// ============================================================
// Search
// ============================================================
function onSearchInput() {
  currentSearchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
  filterAndRender();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  currentSearchQuery = '';
  filterAndRender();
}

function filterAndRender() {
  const items = (allSourceData[currentSource] || []);
  if (!currentSearchQuery) {
    renderSourceItems(document.getElementById('sourceList'), items, currentSource);
    return;
  }
  const filtered = items.filter(item => {
    const title = (item.title || item.drug_name || '').toLowerCase();
    const meta = (item.category || item.study_type || item.issuing_body || item.disease_name || '').toLowerCase();
    return title.includes(currentSearchQuery) || meta.includes(currentSearchQuery);
  });
  renderSourceItems(document.getElementById('sourceList'), filtered, currentSource);
}

// ============================================================
// Upload
// ============================================================
async function uploadDocument() {
  const fileInput = document.getElementById('fileInput');
  const file = fileInput.files[0];
  if (!file) { showToast('请先选择文件', 'error'); return; }

  const btn = document.getElementById('uploadBtn');
  const status = document.getElementById('uploadStatus');
  btn.disabled = true;
  btn.textContent = '⏳ 入库中...';
  const sourceType = document.getElementById('sourceTypeSelect').value;
  if (sourceType === 'auto') {
    status.innerHTML = '<span style="color:#f59e0b">🤖 AI 正在分析文档类型...</span>';
  } else {
    status.innerHTML = '<span style="color:#f59e0b">正在处理文档，请稍候...</span>';
  }

  const form = new FormData();
  form.append('file', file);
  const extraName = document.getElementById('extraFieldInput').value.trim();
  if (extraName) {
    // Map source_type to the appropriate field name
    const fieldMap = { auto: 'drug_name', drug: 'drug_name', disease: 'disease_name', guideline: 'guideline_title', literature: 'title' };
    const fieldName = fieldMap[sourceType] || 'drug_name';
    form.append(fieldName, extraName);
  }
  form.append('source_type', sourceType);
  form.append('desensitize', document.getElementById('desensitizeCheck').checked);

  try {
    const r = await fetch(`${API}/knowledge/upload`, { method: 'POST', body: form });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '上传失败');

    // Build success message with classification info
    const srcLabel = getSourceLabel(d.source_type || sourceType);
    let msg = `✅ 入库成功！`;
    if (sourceType === 'auto') {
      const methodLabel = d.classification_method === 'rule' ? '规则' : 'AI';
      msg += ` 🤖→${srcLabel}: ${d.drug_name} (${d.indexed_chunks}/${d.total_chunks} chunks)`;
      status.innerHTML = `<span style="color:#10b981">${msg}<br><span style="font-size:11px;color:var(--text-muted)">分类方式: ${methodLabel} | 置信度: ${d.classification_confidence || '-'}</span></span>`;
    } else {
      msg += ` ${srcLabel}: ${d.drug_name} (${d.indexed_chunks}/${d.total_chunks} chunks)`;
      status.innerHTML = `<span style="color:#10b981">${msg}</span>`;
    }
    showToast(`已入库 [${srcLabel}]: ${d.drug_name} (${d.indexed_chunks} chunks)`, 'success');
    refreshSources();
    checkHealth();
    fileInput.value = '';
    document.getElementById('fileName').textContent = '';
    document.getElementById('extraFieldInput').value = '';
  } catch (e) {
    status.innerHTML = `<span style="color:#ef4444">❌ ${e.message}</span>`;
    showToast('入库失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '⚡ 上传并入库';
  }
}

function getSourceLabel(st) {
  const labels = { auto: '自动识别', drug: '药品', disease: '疾病', guideline: '指南', literature: '文献' };
  return labels[st] || st;
}

// ============================================================
// Drug List
// ============================================================
// ============================================================
// Source tabs & multi-source list (v1.0.0)
// ============================================================
function switchSourceTab(source) {
  currentSource = source;
  document.querySelectorAll('.source-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.source === source);
  });
  refreshSources();
}

async function refreshSources() {
  const container = document.getElementById('sourceList');
  const countEl = document.getElementById('sourceCounts');
  const sourceType = currentSource;

  try {
    // Try the multi-source endpoint
    let data;
    try {
      const r = await fetch(`${API}/knowledge/sources`);
      if (r.ok) {
        data = await r.json();
        // Update counts (summary)
        if (data.counts) {
          const parts = [];
          const labels = { drug: '药品', disease: '疾病', guideline: '指南', literature: '文献' };
          for (const [st, cnt] of Object.entries(data.counts)) {
            parts.push(`${labels[st] || st}: ${cnt}`);
          }
          countEl.textContent = parts.join(' · ') || '暂无数据';
        }
        // Cache all source data for search
        if (data.items) {
          allSourceData = data.items;
        }
        // Show items for current source with search filter
        filterAndRender();
        return;
      }
    } catch (e) {
      // Fall back to drug-only endpoint
    }

    // Fallback: use existing /knowledge/drugs endpoint
    const r = await fetch(`${API}/knowledge/drugs`);
    if (!r.ok) throw new Error('查询失败');
    const d = await r.json();
    countEl.textContent = d.drugs.length ? `药品: ${d.drugs.length}` : '';
    const items = d.drugs.map(dr => ({
      id: dr.id, title: dr.drug_name, chunk_count: dr.chunk_count, category: dr.category
    }));
    allSourceData = { drug: items };
    filterAndRender();
  } catch (e) {
    container.innerHTML = '<div class="empty-hint" style="color:#ef4444">加载失败，请检查服务状态</div>';
  }
}

function renderSourceItems(container, items, sourceType) {
  if (!items.length) {
    const labels = { drug: '药品说明书', disease: '疾病知识', guideline: '临床指南', literature: '学术文献' };
    const hint = currentSearchQuery
      ? `没有匹配 "${currentSearchQuery}" 的${labels[sourceType] || '文档'}`
      : `暂无已入库${labels[sourceType] || '文档'}，请上传文档`;
    container.innerHTML = `<div class="empty-hint">${hint}</div>`;
    return;
  }

  const metaHtml = (item, st) => {
    const parts = [];
    const chunkInfo = `${item.chunk_count || 0} chunks`;
    parts.push(chunkInfo);
    if (st === 'drug' && item.category) {
      parts.push(`<span class="src-meta-item src-meta-drug">${escHtml(item.category)}</span>`);
    }
    if (st === 'disease') {
      if (item.disease_category) parts.push(`<span class="src-meta-item src-meta-disease">${escHtml(item.disease_category)}</span>`);
      if (item.department) parts.push(`科室: ${escHtml(item.department)}`);
    }
    if (st === 'guideline') {
      if (item.issuing_body) parts.push(`<span class="src-meta-item src-meta-guideline">${escHtml(item.issuing_body)}</span>`);
      if (item.publish_year) parts.push(`📅 ${item.publish_year}`);
    }
    if (st === 'literature') {
      if (item.study_type) parts.push(`<span class="src-meta-item src-meta-literature">${escHtml(item.study_type)}</span>`);
      if (item.journal) parts.push(`📰 ${escHtml(item.journal)}`);
      if (item.publish_year) parts.push(`📅 ${item.publish_year}`);
    }
    return parts.join(' · ');
  };

  container.innerHTML = items.map(dr => `
    <div class="drug-item">
      <div>
        <div class="name">${escHtml(dr.title || dr.drug_name || dr.disease_name || dr.guideline_title || '未命名')}</div>
        <div class="meta">${metaHtml(dr, sourceType)}</div>
      </div>
      <div class="right">
        <span class="drug-count">${dr.chunk_count || 0}</span>
        <button class="btn-danger-sm" onclick="deleteSourceItem('${sourceType}',${dr.id},'${escHtml(dr.title || dr.drug_name || dr.disease_name || dr.guideline_title || '')}')" title="删除">×</button>
      </div>
    </div>`).join('');
}

async function deleteSourceItem(sourceType, id, name) {
  if (!confirm(`确定要删除 "${name}" 吗？\n将同时清除 MySQL 和 Milvus 中的所有相关数据。`)) return;
  try {
    // Try generic delete endpoint
    const r = await fetch(`${API}/knowledge/source/${sourceType}/${id}`, { method: 'DELETE' });
    if (r.status === 404) {
      // Fallback to drug delete
      const r2 = await fetch(`${API}/knowledge/drug/${id}`, { method: 'DELETE' });
      if (!r2.ok) throw new Error('删除失败');
    } else if (!r.ok) {
      throw new Error('删除失败');
    }
    showToast(`已删除 [${sourceType}]: ${name}`, 'success');
    refreshSources();
  } catch (e) { showToast('删除失败: ' + e.message, 'error'); }
}

// Backward compat: old refreshDrugs
async function refreshDrugs() {
  currentSource = 'drug';
  refreshSources();
}

// ============================================================
// Helpers
// ============================================================
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, 3500);
}
</script>
