<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="api-key" content="__API_KEY_PLACEHOLDER__">
<title>药品知识问答 — RAG Pharma</title>
<style>
/* ============================================================
   CSS Variables — Botanical warm theme
   ============================================================ */
:root {
  --primary: #0d9488;
  --primary-hover: #0f766e;
  --primary-light: #f0fdfa;
  --primary-100: #ccfbf1;
  --bg: #fafaf9;
  --card: #ffffff;
  --border: #e7e5e4;
  --text: #1c1917;
  --text-secondary: #78716c;
  --text-muted: #a8a29e;
  --danger: #ef4444;
  --success: #10b981;
  --warning: #f59e0b;
  --source-bg: #fafaf9;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.05);
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ============================================================
   Header
   ============================================================ */
.header {
  width: 100%; max-width: 800px;
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.header-left {
  display: flex; align-items: center; gap: 10px;
}
.header-logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.header-title { font-size: 16px; font-weight: 700; color: var(--text); }
.header-right { display: flex; align-items: center; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 7px 14px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: .15s; font-family: inherit;
  text-decoration: none; white-space: nowrap;
}
.btn-ghost {
  background: transparent; color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-sm { font-size: 12px; padding: 4px 10px; }

/* ============================================================
   Chat Area
   ============================================================ */
.chat-container {
  flex: 1; width: 100%; max-width: 800px;
  display: flex; flex-direction: column;
  overflow: hidden; padding: 0 24px;
}
.chat-messages {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; gap: 20px;
  padding: 8px 0 20px;
}

/* Empty state */
.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 40px 20px;
}
.empty-state .icon { font-size: 56px; margin-bottom: 16px; }
.empty-state h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 14px; color: var(--text-secondary); max-width: 420px; line-height: 1.6; }
.quick-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; max-width: 500px; }
.quick-btn {
  padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--card); cursor: pointer; font-size: 13px;
  color: var(--text-secondary); transition: .15s; font-family: inherit;
}
.quick-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

/* Messages */
.msg {
  display: flex; gap: 10px; max-width: 90%;
  animation: fadeIn .25s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.assistant { align-self: flex-start; }

.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.msg.user .msg-avatar { background: var(--primary-100); }
.msg.assistant .msg-avatar { background: var(--primary-light); }

.msg-bubble {
  padding: 12px 16px; border-radius: var(--radius);
  font-size: 14px; line-height: 1.7; word-break: break-word;
}
.msg.user .msg-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant .msg-bubble { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

.msg-bubble ol { padding-left: 20px; margin: 6px 0; }
.msg-bubble ul { padding-left: 20px; margin: 6px 0; }
.msg-bubble li { margin-bottom: 2px; }

/* Headings */
.msg-bubble h1 { font-size: 18px; font-weight: 700; margin: 16px 0 8px; color: var(--text); }
.msg-bubble h2 { font-size: 16px; font-weight: 700; margin: 14px 0 6px; color: var(--text); }
.msg-bubble h3 { font-size: 15px; font-weight: 600; margin: 12px 0 6px; color: var(--text); }
.msg-bubble h4, .msg-bubble h5, .msg-bubble h6 { font-size: 14px; font-weight: 600; margin: 10px 0 4px; }

/* Horizontal rule */
.msg-bubble hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

/* Blockquote */
.msg-bubble blockquote {
  border-left: 3px solid var(--primary); padding: 6px 12px; margin: 8px 0;
  background: var(--primary-light); border-radius: 0 8px 8px 0; color: var(--text-secondary);
}
.msg-bubble blockquote p { margin: 0; }

/* Inline code */
.msg-bubble code {
  background: var(--primary-100); color: var(--primary-hover);
  padding: 1px 6px; border-radius: 4px; font-size: 13px; font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
}

/* Table */
.table-wrapper { overflow-x: auto; margin: 10px 0; }
.msg-bubble table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.msg-bubble thead th {
  background: var(--primary-light); color: var(--primary-hover); font-weight: 600;
  padding: 8px 12px; text-align: left; border-bottom: 2px solid var(--primary);
  white-space: nowrap;
}
.msg-bubble tbody td {
  padding: 7px 12px; border-bottom: 1px solid var(--border);
}
.msg-bubble tbody tr:hover { background: #fafaf9; }

/* Paragraph */
.msg-bubble p { margin: 4px 0; line-height: 1.7; }

/* Sources */
.sources-box { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
.sources-toggle {
  font-size: 12px; color: var(--text-secondary); cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  background: none; border: none; padding: 4px 0; font-family: inherit;
}
.sources-toggle:hover { color: var(--primary); }
.sources-list { display: none; margin-top: 8px; flex-direction: column; gap: 8px; }
.sources-list.open { display: flex; }
.source-card {
  background: var(--source-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; font-size: 12px;
}
.source-card .src-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.source-card .src-drug { font-weight: 600; color: var(--primary); }
.source-card .src-section {
  font-size: 11px; color: var(--text-secondary);
  background: var(--primary-100); padding: 1px 8px; border-radius: 10px;
}
.source-card .src-score { font-size: 10px; color: var(--text-muted); }
.source-card .src-text { color: var(--text); line-height: 1.5; margin-top: 4px; }

/* Thinking */
.thinking { display: flex; gap: 5px; padding: 4px 0; align-items: center; }
.thinking span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--primary);
  animation: bounce 1.2s infinite;
}
.thinking span:nth-child(2) { animation-delay: .2s; }
.thinking span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

/* ============================================================
   Input Area
   ============================================================ */
.input-area {
  width: 100%; max-width: 800px;
  padding: 12px 24px 16px;
  flex-shrink: 0;
}
.input-row {
  display: flex; gap: 10px; align-items: flex-end;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 8px 8px 16px;
  box-shadow: var(--shadow);
  transition: .15s;
}
.input-row:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,148,136,.1); }
.input-row textarea {
  flex: 1; min-height: 24px; max-height: 120px; resize: none;
  border: none; outline: none; font-size: 14px; font-family: inherit;
  line-height: 1.5; color: var(--text); background: transparent;
  padding: 4px 0;
}
.input-row textarea::placeholder { color: var(--text-muted); }
.send-btn {
  width: 38px; height: 38px; border-radius: 50%; border: none;
  background: var(--primary); color: #fff; cursor: pointer; font-size: 16px;
  transition: .15s; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.send-btn:hover { background: var(--primary-hover); }
.send-btn:disabled { opacity: .4; cursor: not-allowed; }

/* Footer bar */
.footer-bar {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; padding: 0 24px 12px; flex-shrink: 0;
  font-size: 12px; color: var(--text-muted);
}
.footer-dots { display: flex; gap: 6px; align-items: center; }
.footer-dot { width: 7px; height: 7px; border-radius: 50%; }
.footer-dot.ok { background: var(--success); }
.footer-dot.err { background: var(--danger); }
.footer-link { color: var(--text-muted); text-decoration: none; font-size: 12px; }
.footer-link:hover { color: var(--primary); }

/* ============================================================
   Toasts
   ============================================================ */
.toast-container {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 500;
  color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  animation: slideIn .3s ease; max-width: 380px; pointer-events: auto;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--primary); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 640px) {
  .header { padding: 12px 16px; }
  .chat-container { padding: 0 16px; }
  .input-area { padding: 8px 16px 12px; }
  .msg { max-width: 100%; }
  .header-title { font-size: 15px; }
}
</style>
</head>
<body>

<!-- ============================================================
     Header
     ============================================================ -->
<header class="header">
  <div class="header-left">
    <div class="header-logo">💊</div>
    <span class="header-title">药品知识问答</span>
  </div>
  <div class="header-right">
    <button class="btn btn-ghost btn-sm" onclick="newSession()">🔄 新会话</button>
    <button class="btn btn-ghost btn-sm" onclick="clearHistory()">🗑 清除</button>
    <a href="/manage" class="btn btn-ghost btn-sm">⚙️ 管理</a>
  </div>
</header>

<!-- ============================================================
     Chat Messages
     ============================================================ -->
<div class="chat-container">
  <div class="chat-messages" id="chatMessages">
    <div class="empty-state" id="emptyState">
      <div class="icon">💊</div>
      <h2>欢迎使用药品知识问答系统</h2>
      <p>基于 AI 的智能药品说明书问答，支持适应症、用法用量、禁忌、不良反应等查询。所有回答均引用知识库原文。</p>
      <div class="quick-btns">
        <button class="quick-btn" onclick="quickAsk('阿司匹林肠溶片的适应症和用法用量？')">阿司匹林用法用量</button>
        <button class="quick-btn" onclick="quickAsk('布洛芬和对乙酰氨基酚有什么区别？')">布洛芬 vs 对乙酰氨基酚</button>
        <button class="quick-btn" onclick="quickAsk('二甲双胍的禁忌和注意事项？')">二甲双胍禁忌事项</button>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     Input Area
     ============================================================ -->
<div class="input-area">
  <div class="input-row">
    <textarea id="chatInput" rows="1"
      placeholder="输入药品相关问题，例如：阿司匹林肠溶片怎么吃？"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
    <button class="send-btn" onclick="sendMessage()" id="sendBtn" title="发送">➤</button>
  </div>
</div>

<!-- Footer -->
<div class="footer-bar">
  <div class="footer-dots" id="healthDots">
    <span class="footer-dot err" title="Milvus" id="dotMilvus"></span>
    <span class="footer-dot err" title="MySQL" id="dotMysql"></span>
    <span class="footer-dot err" title="Redis" id="dotRedis"></span>
  </div>
  <span style="font-size:11px">系统状态</span>
  <a href="/manage" class="footer-link">知识库管理 →</a>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ============================================================
// API Key auto-inject
// ============================================================
const API_KEY = document.querySelector('meta[name="api-key"]')?.content || '';
if (API_KEY) {
  const _fetch = window.fetch;
  window.fetch = function(url, options = {}) {
    if (typeof url === 'string' && (url.startsWith('/api/') || url.includes('/api/'))) {
      options = { ...options };
      if (options.headers instanceof Headers) {
        options.headers = new Headers(options.headers);
        options.headers.set('X-API-Key', API_KEY);
      } else {
        options.headers = { ...(options.headers || {}), 'X-API-Key': API_KEY };
      }
    }
    return _fetch.call(this, url, options);
  };
}

// ============================================================
// State
// ============================================================
const API = '/api/v1';
let currentSessionId = '';

// ============================================================
// Init
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  checkHealth();
  newSession();
});

// ============================================================
// Health
// ============================================================
async function checkHealth() {
  try {
    const r = await fetch('/health/ready');
    const d = await r.json();
    setDot('dotMilvus', d.checks?.milvus ?? false);
    setDot('dotMysql', d.checks?.mysql ?? false);
    setDot('dotRedis', d.checks?.redis ?? false);
  } catch {
    setDot('dotMilvus', false);
    setDot('dotMysql', false);
    setDot('dotRedis', false);
  }
}
function setDot(id, ok) {
  document.getElementById(id).className = `footer-dot ${ok ? 'ok' : 'err'}`;
}

// ============================================================
// Session
// ============================================================
function newSession() {
  currentSessionId = 'sess_' + Math.random().toString(36).slice(2, 10);
  document.getElementById('chatMessages').innerHTML = `
    <div class="empty-state" id="emptyState">
      <div class="icon">💊</div>
      <h2>新会话已创建</h2>
      <p>可以开始询问药品相关问题，AI 将从知识库中检索并生成回答。</p>
      <div class="quick-btns">
        <button class="quick-btn" onclick="quickAsk('阿司匹林肠溶片的适应症和用法用量？')">阿司匹林用法用量</button>
        <button class="quick-btn" onclick="quickAsk('布洛芬和对乙酰氨基酚有什么区别？')">布洛芬 vs 对乙酰氨基酚</button>
        <button class="quick-btn" onclick="quickAsk('二甲双胍的禁忌和注意事项？')">二甲双胍禁忌事项</button>
      </div>
    </div>`;
}

async function clearHistory() {
  if (!currentSessionId) return;
  try {
    await fetch(`${API}/chat/history/${currentSessionId}`, { method: 'DELETE' });
    showToast('会话已清除', 'info');
    newSession();
  } catch { showToast('清除失败', 'error'); }
}

// ============================================================
// Chat
// ============================================================
function quickAsk(question) {
  document.getElementById('chatInput').value = question;
  sendMessage();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (!message) return;

  const emptyState = document.getElementById('emptyState');
  if (emptyState) emptyState.remove();

  const messages = document.getElementById('chatMessages');
  messages.appendChild(createMsgEl('user', message));
  input.value = '';
  input.style.height = 'auto';

  const thinkEl = createThinkEl();
  messages.appendChild(thinkEl);
  messages.scrollTop = messages.scrollHeight;

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  let fullAnswer = '';
  let sources = [];
  let assistantEl = null;

  try {
    const r = await fetch(`${API}/chat/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, session_id: currentSessionId, stream: true })
    });

    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || `请求失败 (${r.status})`);
    }

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop() || '';

      for (const part of parts) {
        if (!part.trim()) continue;
        const lines = part.split('\n');
        let eventType = '', dataLines = [];

        for (const line of lines) {
          if (line.startsWith('event: ')) eventType = line.slice(7).trim();
          else if (line.startsWith('data: ')) dataLines.push(line.slice(6));
        }
        if (!dataLines.length) continue;

        const dataStr = dataLines.join('\n');

        if (eventType === 'sources') {
          try { sources = JSON.parse(dataStr); } catch {}
          continue;
        }

        try {
          const evt = JSON.parse(dataStr);
          if (evt.event === 'token') {
            fullAnswer += evt.data;
            if (!assistantEl) {
              if (thinkEl.parentNode) thinkEl.remove();
              assistantEl = createMsgEl('assistant', '');
              messages.appendChild(assistantEl);
            }
            assistantEl.querySelector('.msg-bubble').innerHTML = renderMarkdown(fullAnswer);
            messages.scrollTop = messages.scrollHeight;
          } else if (evt.event === 'error') {
            fullAnswer += '\n\n⚠️ ' + evt.data;
            if (!assistantEl) {
              if (thinkEl.parentNode) thinkEl.remove();
              assistantEl = createMsgEl('assistant', '');
              messages.appendChild(assistantEl);
            }
          }
        } catch {
          if (dataStr && dataStr.length < 500) {
            fullAnswer += dataStr;
            if (!assistantEl) {
              if (thinkEl.parentNode) thinkEl.remove();
              assistantEl = createMsgEl('assistant', '');
              messages.appendChild(assistantEl);
            }
            assistantEl.querySelector('.msg-bubble').innerHTML = renderMarkdown(fullAnswer);
          }
        }
      }
    }
  } catch (e) {
    if (!assistantEl) {
      if (thinkEl.parentNode) thinkEl.remove();
      assistantEl = createMsgEl('assistant', '');
      messages.appendChild(assistantEl);
    }
    fullAnswer += '\n\n⚠️ ' + e.message;
  }

  if (thinkEl.parentNode) thinkEl.remove();

  if (!assistantEl) {
    assistantEl = createMsgEl('assistant', '');
    messages.appendChild(assistantEl);
  }
  const bubble = assistantEl.querySelector('.msg-bubble');
  bubble.innerHTML = renderMarkdown(fullAnswer || '（未收到回复）');
  if (sources.length) bubble.appendChild(createSourcesEl(sources));

  sendBtn.disabled = false;
  messages.scrollTop = messages.scrollHeight;
  input.focus();
}

// ============================================================
// UI Helpers
// ============================================================
function createMsgEl(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-avatar">${role === 'user' ? '👤' : '🤖'}</div>
    <div class="msg-bubble">${text ? renderMarkdown(text) : ''}</div>`;
  return div;
}

function createThinkEl() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-bubble"><div class="thinking"><span></span><span></span><span></span></div></div>`;
  return div;
}

function createSourcesEl(sources) {
  const wrapper = document.createElement('div');
  wrapper.className = 'sources-box';
  const toggle = document.createElement('button');
  toggle.className = 'sources-toggle';
  toggle.innerHTML = '📚 查看参考来源 (' + sources.length + ') ▸';
  toggle.onclick = function() {
    const list = this.nextElementSibling;
    const open = list.classList.toggle('open');
    this.innerHTML = '📚 参考来源 (' + sources.length + ') ' + (open ? '▾' : '▸');
  };
  const list = document.createElement('div');
  list.className = 'sources-list';
  list.innerHTML = sources.map(s => `
    <div class="source-card">
      <div class="src-header">
        <span class="src-drug">${escHtml(s.drug_name || '未知')}</span>
        <span class="src-section">${escHtml(s.section || '通用')}</span>
      </div>
      <div class="src-text">${escHtml((s.chunk_text || '').slice(0, 300))}${(s.chunk_text||'').length > 300 ? '...' : ''}</div>
      <div class="src-score">相关性: ${s.score != null ? s.score.toFixed(4) : 'N/A'}</div>
    </div>`).join('');
  wrapper.appendChild(toggle);
  wrapper.appendChild(list);
  return wrapper;
}

function renderMarkdown(text) {
  if (!text) return '';

  // Pre-process: normalize line breaks — convert any literal <br> tags
  // the LLM may output into regular newlines before parsing
  text = text.replace(/<br\s*\/?>/gi, '\n');

  // ---- helpers ----
  const escapeHtml = (s) => String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const inline = (s) => {
    // must run AFTER escaping
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    return s;
  };

  const lines = text.split('\n');
  let html = '';
  let i = 0;

  while (i < lines.length) {
    const raw = lines[i];
    const trimmed = raw.trim();

    // blank line
    if (trimmed === '') {
      i++;
      continue;
    }

    // ---- horizontal rule ----
    if (/^(\\---|\*\s*\*\s*\*|---+|___+|[-*_]{3,})\s*$/.test(trimmed)) {
      html += '<hr>';
      i++;
      continue;
    }

    // ---- headings ----
    const hMatch = trimmed.match(/^(#{1,6})\s+(.+)$/);
    if (hMatch) {
      const level = hMatch[1].length;
      html += '<h' + level + '>' + inline(escapeHtml(hMatch[2])) + '</h' + level + '>';
      i++;
      continue;
    }

    // ---- blockquote ----
    if (trimmed.startsWith('> ')) {
      const bqLines = [];
      while (i < lines.length && lines[i].trim().startsWith('> ')) {
        bqLines.push(lines[i].trim().slice(2));
        i++;
      }
      html += '<blockquote><p>' + inline(bqLines.map(l => escapeHtml(l)).join('<br>')) + '</p></blockquote>';
      continue;
    }

    // ---- table (detect separator row) ----
    if (trimmed.includes('|') && i + 1 < lines.length) {
      const nextTrimmed = lines[i + 1].trim();
      if (/^\|?[\s:-]+\|[\s|:-]+\|?$/.test(nextTrimmed)) {
        // header row
        const headers = trimmed.split('|').map(c => c.trim()).filter(c => c !== '');
        i += 2; // skip separator
        const bodyRows = [];
        while (i < lines.length && lines[i].trim().includes('|')) {
          const cells = lines[i].trim().split('|').map(c => c.trim()).filter(c => c !== '');
          bodyRows.push(cells);
          i++;
        }
        html += '<div class="table-wrapper"><table>';
        html += '<thead><tr>' + headers.map(h => '<th>' + inline(escapeHtml(h)) + '</th>').join('') + '</tr></thead>';
        html += '<tbody>';
        for (const row of bodyRows) {
          html += '<tr>' + row.map(c => '<td>' + inline(escapeHtml(c)) + '</td>').join('') + '</tr>';
        }
        html += '</tbody></table></div>';
        continue;
      }
    }

    // ---- unordered list (consecutive "- " or "* " lines) ----
    if (/^[-*]\s+/.test(trimmed)) {
      const items = [];
      while (i < lines.length && /^[-*]\s+/.test(lines[i].trim())) {
        items.push(lines[i].trim().replace(/^[-*]\s+/, ''));
        i++;
      }
      html += '<ul>' + items.map(it => '<li>' + inline(escapeHtml(it)) + '</li>').join('') + '</ul>';
      continue;
    }

    // ---- ordered list (consecutive "1. " lines) ----
    if (/^\d+\.\s+/.test(trimmed)) {
      const items = [];
      while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) {
        items.push(lines[i].trim().replace(/^\d+\.\s+/, ''));
        i++;
      }
      html += '<ol>' + items.map(it => '<li>' + inline(escapeHtml(it)) + '</li>').join('') + '</ol>';
      continue;
    }

    // ---- paragraph (default) ----
    const paraLines = [];
    while (i < lines.length && lines[i].trim() !== '' &&
           !/^(#{1,6}\s|> |[-*]\s+|\d+\.\s+|\\---|---+|\*\s*\*\s*\*)/.test(lines[i].trim()) &&
           !(lines[i].trim().includes('|') && i + 1 < lines.length &&
             /^\|?[\s:-]+\|[\s|:-]+\|?$/.test((lines[i+1]||'').trim()))) {
      paraLines.push(lines[i].trim());
      i++;
    }
    if (paraLines.length) {
      html += '<p>' + inline(paraLines.map(l => escapeHtml(l)).join('<br>')) + '</p>';
    }
  }

  return html || escapeHtml(text);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, 3500);
}
</script>
</body>
</html>
