<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — RAG 药品知识问答</title>
<style>
/* ============================================================
   CSS Variables — Botanical warm theme
   ============================================================ */
:root {
  --primary: #0d9488;
  --primary-hover: #0f766e;
  --primary-light: #f0fdfa;
  --bg: #fafaf9;
  --card: #ffffff;
  --border: #e7e5e4;
  --text: #1c1917;
  --text-secondary: #78716c;
  --text-muted: #a8a29e;
  --danger: #ef4444;
  --danger-bg: #fef2f2;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================
   Card
   ============================================================ */
.login-card {
  background: var(--card);
  border-radius: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  padding: 40px 36px;
  width: 100%;
  max-width: 400px;
}

.logo {
  width: 48px; height: 48px;
  border-radius: 12px;
  background: var(--primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  margin: 0 auto 12px;
}

.card-title {
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 4px;
  color: var(--text);
}

.card-subtitle {
  text-align: center;
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 24px;
}

/* ============================================================
   Tabs (登录 / 注册)
   ============================================================ */
.tabs {
  display: flex;
  border-bottom: 2px solid var(--border);
  margin-bottom: 24px;
}

.tab {
  flex: 1;
  text-align: center;
  padding: 10px 0;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: .15s;
}

.tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.tab:hover { color: var(--primary); }

/* ============================================================
   Form
   ============================================================ */
.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color .15s;
  color: var(--text);
  background: var(--bg);
}

.form-group input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light);
}

.hint {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.error-msg {
  font-size: 13px;
  color: var(--danger);
  background: var(--danger-bg);
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 12px;
  display: none;
}

.error-msg.show { display: block; }

.btn-submit {
  width: 100%;
  padding: 11px 0;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: .15s;
  margin-top: 4px;
}

.btn-submit:hover { background: var(--primary-hover); }
.btn-submit:disabled { opacity: .5; cursor: not-allowed; }

/* ============================================================
   Success message
   ============================================================ */
.success-msg {
  font-size: 13px;
  color: var(--primary);
  background: var(--primary-light);
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 12px;
  display: none;
}

.success-msg.show { display: block; }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">💊</div>
  <div class="card-title">RAG 药品知识问答</div>
  <div class="card-subtitle">智能药品说明书问答系统</div>

  <div class="tabs">
    <div class="tab active" data-tab="login">登录</div>
    <div class="tab" data-tab="register">注册</div>
  </div>

  <div id="errorMsg" class="error-msg"></div>
  <div id="successMsg" class="success-msg"></div>

  <!-- 登录表单 -->
  <form id="loginForm">
    <div class="form-group">
      <label for="loginUsername">用户名</label>
      <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="loginPassword">密码</label>
      <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-submit">登 录</button>
  </form>

  <!-- 注册表单 -->
  <form id="registerForm" style="display:none;">
    <div class="form-group">
      <label for="regUsername">用户名</label>
      <input type="text" id="regUsername" placeholder="2-30 个字符，支持中英文" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="regPassword">密码</label>
      <input type="password" id="regPassword" placeholder="至少 4 个字符" autocomplete="new-password" required>
    </div>
    <div class="hint">密码规则：≥4 个字符即可，无复杂度要求。</div>
    <button type="submit" class="btn-submit">注 册</button>
  </form>
</div>

<script>
// ============================================================
// Tab 切换
// ============================================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('loginForm').style.display = target === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = target === 'register' ? 'block' : 'none';
    hideError();
    hideSuccess();
  });
});

// ============================================================
// 消息工具
// ============================================================
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('successMsg').classList.remove('show');
}

function hideError() {
  document.getElementById('errorMsg').classList.remove('show');
}

function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('errorMsg').classList.remove('show');
}

function hideSuccess() {
  document.getElementById('successMsg').classList.remove('show');
}

// ============================================================
// API 请求工具
// ============================================================
const API_BASE = '/api/v1';

async function apiCall(path, method = 'GET', body = null) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' },
  };
  if (body) opts.body = JSON.stringify(body);

  const res = await fetch(`${API_BASE}${path}`, opts);
  const data = await res.json();

  if (!res.ok) {
    throw new Error(data.detail || `请求失败 (${res.status})`);
  }
  return data;
}

// ============================================================
// 登录
// ============================================================
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;

    const data = await apiCall('/auth/login', 'POST', { username, password });
    // 保存 token
    localStorage.setItem('rag_token', data.token);
    localStorage.setItem('rag_username', data.username);
    localStorage.setItem('rag_user_id', data.user_id);
    // 跳转到主页面
    window.location.href = '/app';
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
});

// ============================================================
// 注册
// ============================================================
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  btn.textContent = '注册中...';

  try {
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value;

    const data = await apiCall('/auth/register', 'POST', { username, password });
    // 注册成功自动登录
    localStorage.setItem('rag_token', data.token);
    localStorage.setItem('rag_username', data.username);
    localStorage.setItem('rag_user_id', data.user_id);
    showSuccess('注册成功，正在跳转...');
    setTimeout(() => { window.location.href = '/app'; }, 600);
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '注 册';
  }
});

// ============================================================
// 已登录则自动跳转
// ============================================================
if (localStorage.getItem('rag_token')) {
  window.location.href = '/app';
}
</script>
</body>
</html>
